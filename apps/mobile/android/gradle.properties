# Huit gigaoctets de tas, c'est le gabarit d'une machine de compilation, pas
# d'un poste de travail. Sur seize gigaoctets partagés avec le reste du
# système, le démon Gradle se faisait tuer en cours de route et l'APK ne
# sortait jamais : « Gradle build daemon disappeared unexpectedly ».
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
