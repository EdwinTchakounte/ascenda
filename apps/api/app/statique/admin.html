<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ASCENDA, console</title>
<style>
:root{
  --nuit:#0b1435; --nuit-profond:#050d22; --ardoise:#223454;
  --or:#d4a23f; --or-clair:#e8c070; --or-sombre:#9a7118;
  --sauge:#7c9a82; --terracotta:#c4704f;
  --fond:#f7f5f1; --creux:#efece5; --surface:#fff;
  --texte:#1a1f2e; --doux:#6b7280; --trait:rgba(11,20,53,.10);
  --corps:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --barre:248px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{overflow-x:hidden}
body{margin:0;background:var(--fond);color:var(--texte);font-family:var(--corps);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--or-sombre)}

/* ------------------------------------------------------------ connexion */
#connexion{max-width:340px;margin:13vh auto;padding:0 20px}
#connexion .logo{font-weight:700;letter-spacing:.26em;color:var(--or-sombre);
  font-size:.78rem;margin-bottom:26px}
#connexion h1{font-size:1.3rem;margin:0 0 6px}
#connexion p{color:var(--doux);margin:0 0 22px;font-size:.9rem}
#connexion input{width:100%;padding:10px 12px;border:1px solid var(--trait);
  border-radius:10px;background:var(--surface);margin-bottom:10px}
.bouton{border:0;border-radius:22px;background:var(--or);color:#1a1400;
  font-weight:600;cursor:pointer;padding:10px 20px}
.bouton:hover{background:var(--or-clair)}
.bouton.plein{width:100%;padding:11px}
.bouton.fin{background:none;border:1px solid var(--trait);color:var(--doux);
  padding:5px 13px;border-radius:20px;font-weight:400;font-size:.84rem}
.bouton.fin:hover{border-color:var(--or);color:var(--or-sombre);background:none}
.erreur{color:var(--terracotta);font-size:.86rem;margin:8px 0 0;min-height:1.2em}

/* ------------------------------------------------------------ ossature */
#console{display:none;min-height:100%}
#console.ouvert{display:grid;grid-template-columns:var(--barre) 1fr}

aside{background:var(--nuit-profond);color:#b9c1d6;padding:20px 0;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
aside .logo{padding:0 20px 20px;font-weight:700;letter-spacing:.24em;
  color:var(--or-clair);font-size:.76rem}
aside nav{display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1}
aside nav button{background:none;border:0;text-align:left;padding:9px 20px;
  color:#8590aa;cursor:pointer;font-size:.88rem;display:flex;align-items:center;
  gap:10px;border-left:3px solid transparent}
aside nav button:hover{color:#e6e9f2;background:rgba(255,255,255,.03)}
aside nav button[aria-current="true"]{color:var(--or-clair);border-left-color:var(--or);
  background:rgba(212,162,63,.09);font-weight:600}
aside nav .groupe{padding:16px 20px 6px;font-size:.66rem;letter-spacing:.14em;
  text-transform:uppercase;color:#4d5876}
aside .pied{padding:16px 20px 0;border-top:1px solid #17224180;font-size:.75rem;
  color:#5d688a}
aside .pastille-nav{margin-left:auto;background:var(--terracotta);color:#fff;
  border-radius:20px;padding:1px 7px;font-size:.68rem;font-weight:700}

main{min-width:0;padding:0 0 60px}
.barre-haut{position:sticky;top:0;z-index:5;background:rgba(247,245,241,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--trait);
  padding:14px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.barre-haut h1{font-size:1.05rem;margin:0}
.barre-haut .compte{margin-left:auto;font-size:.8rem;color:var(--doux)}
.zone{padding:22px 26px}

/* ------------------------------------------------------------ éléments */
.tuiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.tuile{background:var(--surface);border:1px solid var(--trait);border-radius:14px;
  padding:14px 16px}
.tuile b{display:block;font-size:1.6rem;font-weight:600;line-height:1.15;
  font-variant-numeric:tabular-nums}
.tuile span{font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--doux)}
.tuile .sous{font-size:.78rem;color:var(--doux);margin-top:3px}
.tuile.alerte{border-color:var(--terracotta);background:rgba(196,112,79,.07)}
.tuile.alerte b{color:#9c5233}
.tuile.bien b{color:#4a6b51}

h2{font-size:1rem;margin:26px 0 10px}
h2:first-child{margin-top:0}

/* Le graphique est en SVG, et non en boîtes CSS.
   Une rangée de barres en flex ou en grille se laisse dimensionner par son
   contenu dès qu'un réglage se glisse de travers : les barres vides prenaient
   soixante pixels chacune et débordaient la page. Un SVG place ses marques à
   la coordonnée qu'on lui donne, et nulle part ailleurs. */
.courbe{background:var(--surface);border:1px solid var(--trait);border-radius:14px;
  padding:12px 14px}
.courbe svg{display:block;width:100%;height:96px}
.courbe rect.j{fill:var(--or)}
.courbe rect.j.vide{fill:rgba(11,20,53,.08)}
.courbe rect.j:hover{fill:var(--or-sombre)}
.courbe line.socle{stroke:var(--trait);stroke-width:1}

.filtres{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filtres input,.filtres select{padding:7px 11px;border:1px solid var(--trait);
  border-radius:10px;background:var(--surface)}
.filtres input{min-width:220px}

.tableau{overflow-x:auto;background:var(--surface);border:1px solid var(--trait);
  border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--trait);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--doux);font-weight:600}
tr:last-child td{border-bottom:0}
tbody tr.cliquable{cursor:pointer}
tbody tr.cliquable:hover{background:var(--creux)}
td.nombre{text-align:right;font-variant-numeric:tabular-nums}
td.large{white-space:normal;max-width:420px}
.pastille{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.73rem;font-weight:600}
.p-ok{background:rgba(124,154,130,.20);color:#3f6047}
.p-attente{background:rgba(212,162,63,.20);color:#7d5a12}
.p-mauvais{background:rgba(196,112,79,.18);color:#8e4a2e}
.p-neutre{background:var(--creux);color:var(--doux)}
.vide{padding:30px;text-align:center;color:var(--doux)}
.pages{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.84rem;
  color:var(--doux)}
.pages button{background:var(--surface);border:1px solid var(--trait);border-radius:18px;
  padding:5px 14px;cursor:pointer}
.pages button:disabled{opacity:.4;cursor:default}
.pages button:not(:disabled):hover{border-color:var(--or);color:var(--or-sombre)}
.contenu{background:var(--creux);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.contenu h4{margin:0 0 8px;font-size:.9rem}
.contenu .q{border-bottom:1px solid var(--trait);padding:9px 0}
.contenu .q:last-child{border-bottom:0}
.contenu .q b{display:block;font-weight:600;margin-bottom:4px}
.contenu .bonne{color:#3f6047;font-weight:600}
.contenu .just{font-size:.82rem;color:var(--doux);margin-top:4px;font-style:italic}
.contenu pre{margin:0;white-space:pre-wrap;font-family:var(--mono);font-size:.78rem;
  line-height:1.5;color:var(--doux)}

.cartes{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.carte{background:var(--surface);border:1px solid var(--trait);border-radius:14px;padding:16px}
.carte.on{border-color:var(--or);background:rgba(212,162,63,.06)}
.carte h3{margin:0 0 3px;font-size:.95rem}
.carte p.aide{margin:0 0 12px;font-size:.82rem;color:var(--doux)}
.champ{display:flex;gap:9px;align-items:center;margin-bottom:8px}
.champ label{font-size:.79rem;color:var(--doux);min-width:92px}
.champ input,.champ select,.champ textarea{flex:1;min-width:0;padding:7px 10px;
  border:1px solid var(--trait);border-radius:9px;background:var(--surface)}
.champ textarea{min-height:130px;font-family:var(--mono);font-size:.78rem;line-height:1.5}

.paire{display:flex;justify-content:space-between;gap:16px;padding:7px 0;
  border-bottom:1px solid var(--trait);font-size:.87rem}
.paire:last-child{border-bottom:0}
.paire span{color:var(--doux)}
.paire b{font-weight:600;text-align:right}

dialog{border:0;border-radius:18px;padding:0;max-width:min(900px,94vw);width:100%;
  background:var(--fond);color:var(--texte);box-shadow:0 30px 80px rgba(5,13,34,.35)}
dialog::backdrop{background:rgba(5,13,34,.55)}
dialog .tete{display:flex;align-items:center;gap:14px;padding:16px 22px;
  background:var(--nuit);color:#f4f1e8}
dialog .tete h3{margin:0;font-size:1rem;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
dialog .tete button{background:none;border:1px solid #2b3a5c;color:#b9c1d6;
  border-radius:20px;padding:4px 12px;cursor:pointer;font-size:.82rem}
dialog .corps{padding:20px 22px;max-height:72vh;overflow-y:auto}
code{font-family:var(--mono);font-size:.8em}
.note{font-size:.82rem;color:var(--doux);margin:10px 0 0}
@media (max-width:840px){
  #console.ouvert{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;align-items:center;
    overflow-x:auto;padding:10px 0}
  aside nav{flex-direction:row}
  aside nav .groupe,aside .pied{display:none}
  aside nav button{border-left:0;border-bottom:3px solid transparent;white-space:nowrap}
  aside nav button[aria-current="true"]{border-left-color:transparent;border-bottom-color:var(--or)}
}
</style>
</head>
<body>

<div id="connexion">
  <div class="logo">ASCENDA</div>
  <h1>Console d'exploitation</h1>
  <p>Réservée aux comptes qui portent le droit d'administration.</p>
  <input id="email" type="email" placeholder="Adresse électronique" autocomplete="username">
  <input id="mdp" type="password" placeholder="Mot de passe" autocomplete="current-password">
  <button class="bouton plein" id="entrer">Entrer</button>
  <p class="erreur" id="erreur"></p>
</div>

<div id="console">
  <aside>
    <div class="logo">ASCENDA</div>
    <nav id="menu"></nav>
    <div class="pied" id="pied-barre"></div>
  </aside>
  <main>
    <div class="barre-haut">
      <h1 id="titre-zone">Vue d'ensemble</h1>
      <button class="bouton fin" id="rafraichir">Rafraîchir</button>
      <span class="compte" id="qui"></span>
      <button class="bouton fin" id="sortir">Sortir</button>
    </div>
    <div class="zone" id="zone"></div>
  </main>
</div>

<dialog id="volet"><div class="tete"><h3 id="volet-titre"></h3>
  <button id="volet-fermer">Fermer</button></div>
  <div class="corps" id="volet-corps"></div></dialog>

<script>
const $ = (id) => document.getElementById(id);
let jeton = null, renouveau = null, moi = null, resume = null;
try {
  jeton = localStorage.getItem("ascenda_admin");
  renouveau = localStorage.getItem("ascenda_admin_r");
  moi = localStorage.getItem("ascenda_admin_qui");
} catch (_) {}

/* ---------------------------------------------------------------- réseau */

/** Le jeton d'accès expire au bout d'une demi-heure. Sans renouvellement, une
 *  console d'exploitation déconnecte au milieu du travail, ce qui pousse à la
 *  garder ouverte dans un onglet et à ne plus jamais s'en servir. */
async function renouveler() {
  if (!renouveau) return false;
  try {
    const r = await fetch("/v1/auth/rafraichir", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: renouveau }) });
    if (!r.ok) return false;
    const d = await r.json();
    poserJetons((d.jetons || d));
    return true;
  } catch (_) { return false; }
}

function poserJetons(j) {
  jeton = j.access_token;
  renouveau = j.refresh_token || renouveau;
  try {
    localStorage.setItem("ascenda_admin", jeton);
    if (renouveau) localStorage.setItem("ascenda_admin_r", renouveau);
    if (moi) localStorage.setItem("ascenda_admin_qui", moi);
  } catch (_) {}
}

async function api(chemin, options = {}, reessai = true) {
  const r = await fetch(chemin, {
    ...options,
    headers: { "Content-Type": "application/json",
      ...(jeton ? { Authorization: "Bearer " + jeton } : {}), ...(options.headers || {}) },
  });
  if (r.status === 401 && reessai && (await renouveler())) {
    return api(chemin, options, false);
  }
  if (r.status === 401 || r.status === 403) { sortir(); throw new Error("refuse"); }
  if (!r.ok) throw new Error("http " + r.status);
  return r.status === 204 ? null : r.json();
}

function sortir() {
  jeton = renouveau = null;
  try {
    localStorage.removeItem("ascenda_admin");
    localStorage.removeItem("ascenda_admin_r");
  } catch (_) {}
  $("console").classList.remove("ouvert");
  $("connexion").style.display = "";
}
$("sortir").onclick = sortir;

$("entrer").onclick = async () => {
  $("erreur").textContent = "";
  try {
    const r = await fetch("/v1/auth/connexion", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: $("email").value.trim(), mot_de_passe: $("mdp").value }) });
    if (!r.ok) throw new Error("identifiants");
    const d = await r.json();
    moi = (d.utilisateur || {}).email || $("email").value.trim();
    poserJetons(d.jetons || d);
    await demarrer();
  } catch (e) {
    $("erreur").textContent = e.message === "identifiants"
      ? "Adresse ou mot de passe incorrect."
      : "Connexion impossible. Le service répond-il ?";
  }
};
$("mdp").addEventListener("keydown", (e) => { if (e.key === "Enter") $("entrer").click(); });

/* ---------------------------------------------------------------- format */
const nb = (n) => (n ?? 0).toLocaleString("fr-FR");
const xaf = (n) => nb(n) + " XAF";
const jour = (s) => s ? new Date(s).toLocaleDateString("fr-FR",
  { day: "2-digit", month: "2-digit", year: "2-digit" }) : "";
const instant = (s) => s ? new Date(s).toLocaleString("fr-FR",
  { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
const ech = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const CLASSES = { valide: "p-ok", envoye: "p-ok", active: "p-ok", none: "p-neutre",
  simule: "p-attente", en_attente: "p-attente", pending: "p-attente",
  rejete: "p-mauvais", echec: "p-mauvais", removed: "p-mauvais", expired: "p-neutre" };
const pastille = (v) => v === null || v === undefined || v === ""
  ? "" : `<span class="pastille ${CLASSES[v] || "p-neutre"}">${ech(v)}</span>`;

function cellule(v, f) {
  if (v === null || v === undefined || v === "") return "";
  if (f === "jour") return jour(v);
  if (f === "instant") return instant(v);
  if (f === "xaf") return xaf(v);
  if (f === "pastille") return pastille(v);
  if (f === "oui") return v ? `<span class="pastille p-ok">oui</span>` : "";
  // Un état normal ne mérite pas de pastille : n'afficher que ce qui demande
  // qu'on s'en occupe fait ressortir les deux lignes qui comptent sur soixante.
  if (f === "signal") return v && v !== "none" ? pastille(v) : "";
  if (f === "json") return `<code>${ech(JSON.stringify(v)).slice(0, 110)}</code>`;
  if (f === "liste") return ech(Array.isArray(v) ? v.join(", ") : v);
  return ech(v);
}

function table(colonnes, lignes, surClic) {
  if (!lignes.length) return `<div class="tableau"><div class="vide">Rien à afficher.</div></div>`;
  const corps = lignes.map((l, i) =>
    `<tr class="${surClic ? "cliquable" : ""}" data-i="${i}">` +
    colonnes.map((c) => {
      const aligne = ["xaf", "nombre"].includes(c[2]) ? "nombre" : (c[2] === "large" ? "large" : "");
      return `<td class="${aligne}">${cellule(l[c[0]], c[2])}</td>`;
    }).join("") + `</tr>`).join("");
  return `<div class="tableau"><table><thead><tr>` +
    colonnes.map((c) => `<th>${c[1]}</th>`).join("") +
    `</tr></thead><tbody>${corps}</tbody></table></div>`;
}

function brancherClics(lignes, surClic) {
  if (!surClic) return;
  $("zone").querySelectorAll("tbody tr.cliquable").forEach((tr) => {
    tr.onclick = () => surClic(lignes[Number(tr.dataset.i)]);
  });
}

/** Les commandes de page. Elles n'apparaissent que s'il y a plus d'une page :
 *  une pagination sur une liste de trois lignes est du bruit. */
function pagination(env, allerA) {
  if (!env || env.pages <= 1) return "";
  return `<div class="pages">
    <button ${env.page <= 1 ? "disabled" : ""} data-page="${env.page - 1}">Précédente</button>
    <span>page ${env.page} sur ${env.pages} · ${nb(env.total)} au total</span>
    <button ${env.page >= env.pages ? "disabled" : ""} data-page="${env.page + 1}">Suivante</button>
  </div>`;
}

function brancherPages(allerA) {
  $("zone").querySelectorAll(".pages [data-page]").forEach((b) => {
    b.onclick = () => allerA(Number(b.dataset.page));
  });
}

/* ----------------------------------------------------------------- volet */
function ouvrirVolet(titre, html) {
  $("volet-titre").textContent = titre;
  $("volet-corps").innerHTML = html;
  $("volet").showModal();
}
$("volet-fermer").onclick = () => $("volet").close();
const paires = (obj) => Object.entries(obj)
  .map(([k, v]) => `<div class="paire"><span>${ech(k)}</span><b>${v ?? ""}</b></div>`).join("");

/* ----------------------------------------------------------------- zones */
const ZONES = [];
const zone = (z) => { ZONES.push(z); return z; };

zone({ cle: "ensemble", groupe: "Piloter", titre: "Vue d'ensemble", async rendre() {
  const d = await api("/v1/admin/tableau-de-bord?jours=30");
  resume = d;
  const orph = d.paiements.orphelins || 0, ech2 = d.courriels.echecs || 0;
  const tuiles = [
    { v: nb(d.comptes.total), l: "comptes", s: "+" + nb(d.comptes.aujourdhui) + " aujourd'hui" },
    { v: nb(d.actifs.semaine), l: "actifs 7 jours", s: nb(d.actifs.mois) + " sur 30 jours" },
    { v: nb(d.comptes.abonnes), l: "abonnés", s: nb(d.abonnements.actifs) + " abonnements actifs" },
    { v: xaf(d.paiements.encaisse), l: "encaissé", s: nb(d.paiements.valides) + " paiements" },
    { v: nb(d.paiements.en_attente), l: "en attente", s: nb(d.paiements.rejetes) + " rejetés" },
    { v: nb(d.abonnements.bientot_echus), l: "échéance sous 7 j" },
    { v: nb(orph), l: "webhooks orphelins", c: orph ? "alerte" : "bien",
      s: orph ? "à examiner" : "rien en souffrance" },
    { v: nb(ech2), l: "courriels en échec", c: ech2 ? "alerte" : "bien",
      s: nb(d.courriels.simules) + " simulés" },
  ];
  const max = Math.max(1, ...d.courbe.map((p) => p.comptes));
  // Une grille de 100 par 100, étirée par le SVG : les coordonnées sont des
  // pourcentages déguisés, et la largeur des barres ne dépend d'aucun réglage
  // de disposition.
  const n = d.courbe.length, pas = 100 / n, large = Math.max(pas * 0.68, 0.8);
  const barres = d.courbe.map((p, i) => {
    const h = p.comptes ? Math.max((p.comptes / max) * 96, 2) : 1.5;
    return `<rect class="j ${p.comptes ? "" : "vide"}" x="${(i * pas + (pas - large) / 2).toFixed(2)}"` +
      ` y="${(100 - h).toFixed(2)}" width="${large.toFixed(2)}" height="${h.toFixed(2)}" rx="0.4">` +
      `<title>${jour(p.jour)} : ${p.comptes} compte(s), ${p.paiements} paiement(s)</title></rect>`;
  }).join("");
  return `<div class="tuiles">` + tuiles.map((t) =>
      `<div class="tuile ${t.c || ""}"><b>${t.v}</b><span>${t.l}</span>` +
      (t.s ? `<div class="sous">${t.s}</div>` : "") + `</div>`).join("") + `</div>
    <h2>Inscriptions, jour par jour</h2>
    <div class="courbe"><svg viewBox="0 0 100 100" preserveAspectRatio="none" role="img"
      aria-label="Inscriptions des ${n} derniers jours, maximum ${max} en un jour">
      ${barres}<line class="socle" x1="0" y1="99.7" x2="100" y2="99.7"
        vector-effect="non-scaling-stroke"></line></svg></div>
    <p class="note">Maximum sur la période : ${nb(max)} comptes en un jour.</p>
    <h2>Corpus</h2><div class="tuiles">
      <div class="tuile"><b>${nb(d.corpus.ouvrages)}</b><span>ouvrages</span></div>
      <div class="tuile"><b>${nb(d.corpus.passages)}</b><span>passages</span>
        <div class="sous">${nb(d.corpus.vectorises)} vectorisés</div></div>
      <div class="tuile"><b>${nb(d.corpus.quiz)}</b><span>lots de quiz</span></div>

zone({ cle: "corpus", groupe: "Contenu", titre: "Le corpus",
  filtres: `<input id="f-corpus" placeholder="Titre ou auteur…">
    <label style="font-size:.84rem;color:var(--doux)">
      <input type="checkbox" id="f-manque" style="min-width:auto"> incomplets seulement</label>`,
  async rendre() {
    const q = ($("f-corpus") || {}).value || "";
    const m = $("f-manque") && $("f-manque").checked;
    const env = await api("/v1/admin/corpus?par_page=40&page=" + (this.page || 1) +
      (q.length > 1 ? "&q=" + encodeURIComponent(q) : "") + (m ? "&manque=true" : ""));
    this.lignes = env.lignes; this.env = env;
    // Les compteurs viennent du total du serveur, pas de la page affichée :
    // annoncer « 40 ouvrages » parce que la page en montre quarante serait faux.
    const incomplets = m ? env.total : (resume ? env.total - 0 : env.total);
    return `<div class="tuiles" style="margin-bottom:16px">
        <div class="tuile"><b>${nb(env.total)}</b><span>ouvrages ${m ? "incomplets" : "au corpus"}</span>
          <div class="sous">page ${env.page} sur ${env.pages}</div></div>
        <div class="tuile"><b>${nb(env.lignes.filter((l) => l.complet).length)}</b>
          <span>complets sur cette page</span></div>
        <div class="tuile"><b>${nb(env.lignes.filter((l) => l.lecture_integrale).length)}</b>
          <span>intégraux sur cette page</span></div>
      </div>` +
      table([["titre", "ouvrage", "large"], ["axes", "axes", "large"],
        ["pages", "pages", "nombre"], ["chapitres_utiles", "chapitres", "nombre"],
        ["vectorises", "vectorisés", "nombre"], ["quiz", "quiz", "nombre"],
        ["citations", "citations", "nombre"], ["lecture_integrale", "intégral", "oui"],
        ["retrait", "retrait", "signal"]], env.lignes, true) + pagination(env);
  },
  async apres() {
    brancherClics(this.lignes, async (l) => {
      const d = await api("/v1/admin/corpus/" + l.id);
      const dr = d.droits;
      ouvrirVolet(d.titre, `
        <div class="cartes">
          <div class="carte"><h3>L'ouvrage</h3>${paires({
            auteurs: ech((d.auteurs || []).join(", ")), année: d.annee ?? "",
            éditeur: ech(d.editeur || ""), ISBN: ech(d.isbn || ""),
            pages: nb(d.pages), langue: ech(d.langue || ""),
            axes: ech(d.axes.map((a) => a.label).join(", ")),
            "entré le": jour(d.entre_le), fichier: `<code>${ech((d.fichier || "").slice(0, 34))}</code>`,
          })}</div>
          <div class="carte"><h3>Droits</h3>
            <p class="aide">Le seul endroit où l'on modifie un ouvrage. Le titre et le texte
              viennent de <code>data/</code> : les corriger ici les ferait diverger de leur
              source, et le prochain import les écraserait.</p>
            <div class="champ"><label>lecture intégrale</label>
              <select id="d-integral">
                <option value="false" ${dr.lecture_integrale ? "" : "selected"}>non, extraits</option>
                <option value="true" ${dr.lecture_integrale ? "selected" : ""}>oui</option></select></div>
            <div class="champ"><label>plafond</label>
              <input id="d-plafond" type="number" min="0" value="${dr.plafond_extrait ?? 0}"></div>
            <div class="champ"><label>retrait</label>
              <select id="d-retrait">
                ${["none", "pending", "removed"].map((v) =>
                  `<option value="${v}" ${dr.retrait === v ? "selected" : ""}>${v}</option>`).join("")}
              </select></div>
            <button class="bouton" id="d-poser" data-id="${d.id}">Enregistrer les droits</button>
            <p class="note">Un retrait autre que « none » sort l'ouvrage de partout :
              bibliothèque, recherche, réponses de l'agent, plans déjà construits.</p></div>
          <div class="carte"><h3>Ce qui est produit</h3>${d.derives.length
            ? d.derives.map((v) => `<div class="paire"><span>${ech(v.type)}</span>` +
                `<b>${nb(v.lots)} lots, ${nb(v.jetons_entree + v.jetons_sortie)} jetons</b></div>`).join("")
            : `<p class="aide">Rien de produit pour cet ouvrage.</p>`}</div>
        </div>
        <h2>Lire ce qui a été produit</h2>
        <div class="filtres">
          <select id="v-kind">
            ${d.derives.map((v) => `<option value="${ech(v.type)}">${ech(v.type)} (${v.lots})</option>`).join("")}
          </select>
          <button class="bouton fin" id="v-pdf" data-id="${d.id}">Ouvrir le PDF d'origine</button>
        </div>
        <div id="v-contenu"><p class="note">Choisissez un type pour lire le contenu.</p></div>
        <h2>Les chapitres</h2>
        ${table([["ordre", "n°", "nombre"], ["titre", "titre", "large"],
          ["page_debut", "de", "nombre"], ["page_fin", "à", "nombre"],
          ["tokens", "tokens", "nombre"], ["quiz", "quiz", "nombre"],
          ["citations", "citations", "nombre"]], d.chapitres)}`);

      // Le PDF part avec le jeton : une balise `a href` ne peut pas porter
      // d'en-tête d'autorisation. On récupère le flux et on l'ouvre.
      const bp = $("v-pdf");
      if (bp) bp.onclick = async () => {
        bp.textContent = "…";
        try {
          const r = await fetch(`/v1/admin/corpus/${bp.dataset.id}/fichier`,
            { headers: { Authorization: "Bearer " + jeton } });
          if (!r.ok) throw new Error();
          const url = URL.createObjectURL(await r.blob());
          window.open(url, "_blank");
          // On rend la mémoire au navigateur : un PDF de cent mégaoctets gardé
          // en objet blob le reste tant que l'onglet vit.
          setTimeout(() => URL.revokeObjectURL(url), 60000);
          bp.textContent = "Ouvrir le PDF d'origine";
        } catch (_) { bp.textContent = "Fichier introuvable"; }
      };

      let pageContenu = 1;
      async function lireContenu() {
        const kind = $("v-kind").value;
        $("v-contenu").innerHTML = `<p class="note">Chargement…</p>`;
        try {
          const env = await api(`/v1/admin/corpus/${d.id}/derives?kind=${kind}` +
            `&par_page=5&page=${pageContenu}`);
          $("v-contenu").innerHTML = env.lignes.map((l) => `
            <div class="contenu">
              <h4>${ech(l.chapitre || d.titre)}${l.page ? ` · p. ${l.page}` : ""}</h4>
              ${rendreContenu(kind, l.contenu)}
              <p class="note">${ech(l.modele || "")} · ${nb(l.jetons)} jetons · ${instant(l.produit_le)}</p>
            </div>`).join("") + (env.pages > 1 ? `<div class="pages">
              <button ${env.page <= 1 ? "disabled" : ""} data-c="${env.page - 1}">Précédente</button>
              <span>page ${env.page} sur ${env.pages} · ${nb(env.total)} lots</span>
              <button ${env.page >= env.pages ? "disabled" : ""} data-c="${env.page + 1}">Suivante</button>
            </div>` : "");
          $("v-contenu").querySelectorAll("[data-c]").forEach((b) => {
            b.onclick = () => { pageContenu = Number(b.dataset.c); lireContenu(); };
          });
        } catch (_) {
          $("v-contenu").innerHTML = `<p class="note">Rien à lire pour ce type.</p>`;
        }
      }
      if ($("v-kind")) {
        $("v-kind").onchange = () => { pageContenu = 1; lireContenu(); };
        if (d.derives.length) lireContenu();
      }
      const b = $("d-poser");
      if (b) b.onclick = async () => {
        b.textContent = "…";
        try {
          await api("/v1/admin/corpus/" + b.dataset.id, { method: "PATCH",
            body: JSON.stringify({
              redistributable: $("d-integral").value === "true",
              max_excerpt_chars: Number($("d-plafond").value || 0),
              takedown_status: $("d-retrait").value }) });
          $("volet").close(); await afficher(courante);
        } catch (_) { b.textContent = "Échec"; }
      };
    });
  } });

zone({ cle: "import", groupe: "Contenu", titre: "Ajouter un ouvrage", async rendre() {
  const axes = await api("/v1/admin/axes");
  const env = await api("/v1/admin/travaux?par_page=20&page=" + (this.page || 1));
  this.env = env;
  const enCours = env.lignes.filter((t) => t.etat === "en_cours" || t.etat === "en_attente").length;
  return `<div class="cartes" style="margin-bottom:20px">
    <div class="carte">
      <h3>Déposer un PDF</h3>
      <p class="aide">Le fichier est écrit là où le pipeline va le chercher, puis son
        ingestion entre dans la file. L'envoi n'est pas reprenable : sur une connexion
        qui coupe, il faut recommencer.</p>
      <div class="champ"><label>axe</label><select id="i-axe">
        <option value="">à classer plus tard</option>
        ${axes.map((a) => `<option value="${ech(a.slug)}">${ech(a.label)}</option>`).join("")}
      </select></div>
      <div class="champ"><label>fichier</label>
        <input id="i-fichier" type="file" accept="application/pdf,.pdf"></div>
      <button class="bouton" id="i-envoyer">Déposer et ingérer</button>
      <p class="note" id="i-etat">Cent mégaoctets au maximum.</p>
    </div>
    <div class="carte">
      <h3>Lancer une étape</h3>
      <p class="aide">Ce n'est pas exécuté ici : l'ouvrier prend le travail dans les
        secondes qui suivent. Un même travail lourd ne s'inscrit pas deux fois.</p>
      <div class="champ"><label>étape</label><select id="i-type">
        <option value="structure">Reconstituer les chapitres</option>
        <option value="passages">Reconstruire les passages</option>
        <option value="vecteurs">Vectoriser le corpus</option>
        <option value="derive">Produire les dérivés</option>
        <option value="import_data">Importer data/ vers la base</option>
      </select></div>
      <button class="bouton" id="i-lancer">Mettre dans la file</button>
      <p class="note" id="i-lancer-etat">${enCours ? nb(enCours) + " travail(aux) en file." : "File vide."}</p>
    </div>
  </div>
  <h2>La file</h2>` +
  table([["libelle", "travail"], ["etat", "état", "pastille"],
    ["progression", "avancement", "nombre"], ["ouvrage", "ouvrage", "large"],
    ["demandeur", "demandé par"], ["cree_le", "inscrit", "instant"],
    ["fini_le", "fini", "instant"]], env.lignes, true) + pagination(env);
},
  async apres() {
    const envoyer = $("i-envoyer");
    if (envoyer) envoyer.onclick = async () => {
      const f = $("i-fichier").files[0];
      if (!f) { $("i-etat").textContent = "Choisissez un fichier."; return; }
      const forme = new FormData();
      forme.append("fichier", f);
      if ($("i-axe").value) forme.append("axe", $("i-axe").value);
      $("i-etat").textContent = `Envoi de ${(f.size / 1048576).toFixed(1)} Mo…`;
      envoyer.disabled = true;
      try {
        // Pas de `Content-Type` : le navigateur pose lui-même la frontière
        // multipart, et l'écraser casse l'envoi.
        const r = await fetch("/v1/admin/corpus/import", { method: "POST",
          headers: { Authorization: "Bearer " + jeton }, body: forme });
        if (!r.ok) {
          const e = await r.json().catch(() => ({}));
          throw new Error((e.detail || {}).message || "refusé");
        }
        $("i-etat").textContent = "Déposé. L'ingestion est dans la file.";
        $("i-fichier").value = "";
        setTimeout(() => afficher(courante), 1200);
      } catch (e) {
        $("i-etat").textContent = e.message || "L'envoi a échoué.";
      } finally { envoyer.disabled = false; }
    };

    const lancer = $("i-lancer");
    if (lancer) lancer.onclick = async () => {
      lancer.textContent = "…";
      try {
        await api("/v1/admin/travaux", { method: "POST",
          body: JSON.stringify({ type: $("i-type").value }) });
        $("i-lancer-etat").textContent = "Inscrit dans la file.";
        setTimeout(() => afficher(courante), 900);
      } catch (_) {
        $("i-lancer-etat").textContent = "Déjà dans la file, ou refusé.";
      } finally { lancer.textContent = "Mettre dans la file"; }
    };

    brancherClics(this.env.lignes, async (l) => {
      const d = await api("/v1/admin/travaux/" + l.id);
      ouvrirVolet(d.libelle, `
        <div class="cartes"><div class="carte"><h3>Le travail</h3>${paires({
          état: pastille(d.etat), avancement: d.progression + " %",
          ouvrage: ech(d.ouvrage || ""), "demandé par": ech(d.demandeur || ""),
          inscrit: instant(d.cree_le), commencé: instant(d.commence_le),
          fini: instant(d.fini_le),
          "durée attendue": d.duree_attendue_min ? d.duree_attendue_min + " min" : "",
          erreur: ech(d.erreur || ""),
        })}
        <div class="champ" style="margin-top:14px">
          ${["echec", "annule"].includes(d.etat)
            ? `<button class="bouton" data-relance="${d.id}">Relancer</button>` : ""}
          ${d.etat === "en_attente"
            ? `<button class="bouton fin" data-annule="${d.id}">Annuler</button>` : ""}
        </div></div></div>
        <h2>Le journal</h2>
        <div class="contenu"><pre>${ech(d.journal || "Rien encore.")}</pre></div>`);
      const r = $("volet-corps").querySelector("[data-relance]");
      if (r) r.onclick = async () => {
        await api(`/v1/admin/travaux/${r.dataset.relance}/relancer`, { method: "POST" });
        $("volet").close(); afficher(courante);
      };
      const an = $("volet-corps").querySelector("[data-annule]");
      if (an) an.onclick = async () => {
        await api(`/v1/admin/travaux/${an.dataset.annule}`, { method: "DELETE" });
        $("volet").close(); afficher(courante);
      };
    });
  } });

      <p class="note" id="a-etat">Le raccourci sert d'adresse publique : minuscules,
        chiffres et tirets, et il ne change plus une fois posé.</p>
    </div></div>
    <h2>Les ${axes.length} pôles</h2>` +
    table([["slug", "raccourci"], ["label", "nom", "large"],
      ["ouvrages", "ouvrages", "nombre"], ["centroide", "centroïde", "oui"],
      ["premium", "réservé", "oui"], ["description", "description", "large"]], axes);
},
  async apres() {
    const b = $("a-creer");
    if (b) b.onclick = async () => {
      b.textContent = "…";
      try {
        await api("/v1/admin/axes", { method: "POST", body: JSON.stringify({
          slug: $("a-slug").value.trim(), label: $("a-label").value.trim(),
          description: $("a-desc").value.trim() || null }) });
        $("a-etat").textContent = "Axe créé.";
        setTimeout(() => afficher(courante), 900);
      } catch (_) {
        $("a-etat").textContent = "Refusé : raccourci déjà pris, ou mal formé.";
      } finally { b.textContent = "Créer l'axe"; }
    };
  } });

          else valeur[c.dataset.c] = c.value;

          await api("/v1/admin/reglages/" + b.dataset.reglage, { method: "POST", body: JSON.stringify({ valeur }) });

/** Le contenu d'un dérivé, présenté selon ce qu'il est.
 *  Un quiz se lit question par question avec sa bonne réponse et sa
 *  justification ; une liste de citations se lit citation par citation. Tout
 *  jeter dans un bloc JSON reviendrait à ne rien montrer. */
function rendreContenu(kind, c) {
  if (!c) return `<p class="note">Vide.</p>`;
  if (kind === "quiz") {
    const q = c.questions || [];
    if (!q.length) return `<p class="note">Lot vide. ${ech(c.motif || "")}</p>`;
    return q.map((x) => `<div class="q">
      <b>${ech(x.enonce || x.question || "")}</b>
      ${(x.options || x.choix || []).map((o, i) => {
        const texte = typeof o === "string" ? o : (o.texte || o.libelle || "");
        const bonne = x.bonne_reponse === i || x.reponse === i ||
          (typeof o === "object" && o.correcte);
        return `<div class="${bonne ? "bonne" : ""}">${bonne ? "▸ " : "· "}${ech(texte)}</div>`;
      }).join("")}
      ${x.explication ? `<div class="just">${ech(x.explication)}</div>` : ""}
      ${x.extrait_source ? `<div class="just">« ${ech(x.extrait_source)} »${
        x.page ? ` p. ${x.page}` : ""}</div>` : ""}
    </div>`).join("");
  }
  if (kind === "citation") {
    const l = c.citations || [];
    if (!l.length) return `<p class="note">Aucune citation.</p>`;
    return l.map((x) => `<div class="q"><b>« ${ech(x.texte || x.citation || "")} »</b>
      <div class="just">${x.page ? `p. ${x.page}` : ""} ${ech(x.commentaire || x.contexte || "")}</div>
    </div>`).join("");
  }
  // Les autres types n'ont pas de forme figée : on les rend lisibles sans
  // prétendre les mettre en page.
  return `<pre>${ech(JSON.stringify(c, null, 2)).slice(0, 4000)}</pre>`;
}

/* --------------------------------------------------------------- rendu */
let courante = ZONES[0];

async function afficher(z) {
  courante = z;
  $("titre-zone").textContent = z.titre;
  $("menu").querySelectorAll("button").forEach((b) =>
    b.setAttribute("aria-current", b.dataset.cle === z.cle));
  $("zone").innerHTML = `<div class="vide">Chargement…</div>`;
  try {
    const html = await z.rendre();
    $("zone").innerHTML = (z.filtres ? `<div class="filtres">${z.filtres}</div>` : "") + html;
    // Les filtres sont réinsérés à chaque rendu : on rebranche, et on
    // conserve ce qui était saisi en le relisant avant de redessiner.
    $("zone").querySelectorAll(".filtres input, .filtres select").forEach((c) => {
      const evenement = c.tagName === "SELECT" || c.type === "checkbox" ? "change" : "input";
      let minuterie;
      c.addEventListener(evenement, () => {
        clearTimeout(minuterie);
        // Changer un filtre ramène à la première page : rester sur la page
        // douze d'une liste devenue longue de trois affiche un vide inexplicable.
        minuterie = setTimeout(() => { z.page = 1; afficher(z); },
          evenement === "input" ? 350 : 0);
      });
    });
    brancherPages((n) => { z.page = n; afficher(z); });
    if (z.apres) await z.apres();
  } catch (_) {
    $("zone").innerHTML = `<div class="tableau"><div class="vide">Impossible de charger cette vue.</div></div>`;
  }
}
$("rafraichir").onclick = () => afficher(courante);

function menu() {
  let groupe = null;
  $("menu").innerHTML = ZONES.map((z) => {
    const tete = z.groupe !== groupe ? ((groupe = z.groupe), `<div class="groupe">${z.groupe}</div>`) : "";
    const n = z.alerte ? z.alerte() : 0;
    return tete + `<button data-cle="${z.cle}" aria-current="false">${z.titre}` +
      (n ? `<span class="pastille-nav">${nb(n)}</span>` : "") + `</button>`;
  }).join("");
  $("menu").querySelectorAll("button").forEach((b) => {
    b.onclick = () => afficher(ZONES.find((z) => z.cle === b.dataset.cle));
  });
}

async function demarrer() {
  try {
    resume = await api("/v1/admin/tableau-de-bord?jours=30");
    $("connexion").style.display = "none";
    $("console").classList.add("ouvert");
    $("qui").textContent = moi || "";
    const c = resume.corpus;
    $("pied-barre").textContent =
      `${nb(c.ouvrages)} ouvrages · ${nb(c.vectorises)}/${nb(c.passages)} vectorisés`;
    menu();
    await afficher(ZONES[0]);
  } catch (_) { sortir(); }
}

if (jeton) demarrer(); else $("connexion").style.display = "";
