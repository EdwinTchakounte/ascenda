name: ascenda

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ascenda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports: ["${POSTGRES_PORT}:5432"]
    volumes:
      - ascenda_pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ascenda-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9250:9000"
      - "9251:9001"
    volumes:
      - ascenda_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: ascenda-minio-init
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p local/${MINIO_BUCKET};
      mc mb -p local/ascenda-derivatives;
      mc mb -p local/ascenda-covers;
      mc anonymous set download local/ascenda-covers;
      echo 'buckets prets'; "

  redis:
    image: redis:7-alpine
    container_name: ascenda-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports: ["${REDIS_PORT}:6379"]
    volumes:
      - ascenda_redis:/data

volumes:
  ascenda_pgdata:   {name: ascenda_pgdata}
  ascenda_minio:    {name: ascenda_minio}
  ascenda_redis:    {name: ascenda_redis}
