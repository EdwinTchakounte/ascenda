# Les deux services applicatifs, en complément de docker-compose.yml qui porte
# la base, le stockage et le cache.
#
#   cd infra/docker
#   docker compose --env-file ../../.env up -d                      # socle seul
#   docker compose --env-file ../../.env -f docker-compose.yml -f docker-compose.app.yml up -d --build
#
# Le socle et l'application sont séparés parce qu'ils n'ont pas le même cycle :
# on redéploie l'API dix fois par semaine, la base une fois par an.

name: ascenda

services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        # Faux par défaut : l'image reste à 340 Mo et la recherche est en plein
        # texte, ce que l'API annonce dans le champ `mode`. À vrai, elle sait
        # chercher par le sens, au prix de deux gigaoctets d'image.
        AVEC_RECHERCHE_SEMANTIQUE: ${RECHERCHE_SEMANTIQUE:-false}
    container_name: ascenda-api
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      # Dans le réseau du compose, la base s'appelle par son nom de service et
      # écoute sur son port interne, pas sur celui publié vers l'hôte.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      DOSSIER_LIVRES: /chantier/livres
      API_ENV: ${API_ENV:-prod}
      JWT_SECRET: ${JWT_SECRET}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-claude-opus-5}
      TARA_API_KEY: ${TARA_API_KEY:-}
      TARA_BUSINESS_ID: ${TARA_BUSINESS_ID:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      # Ce réglage valide des paiements sans encaissement : l'API refuse de
      # démarrer s'il est actif alors que API_ENV vaut prod.
      PAIEMENT_TEST_AUTO_VALIDE: "false"
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      # L'expéditeur des courriels. Il était absent de cette liste : l'exploitant
      # le posait dans son .env et le conteneur ne le voyait jamais, si bien que
      # les reçus partaient au nom par défaut. Chez Brevo, un expéditeur non
      # validé est un envoi refusé, donc pas de reçu et pas de réinitialisation
      # de mot de passe.
      MAIL_EXPEDITEUR: ${MAIL_EXPEDITEUR:-}
      # Les fenêtres du rapprochement des paiements. Réglables sans reconstruire
      # l'image, parce que c'est le genre de valeur qu'on ajuste en regardant
      # comment Tara répond en vrai.
      RECONCILIATION_TIMEOUT_HEURES: ${RECONCILIATION_TIMEOUT_HEURES:-24}
      RECONCILIATION_PAUSE_SECONDES: ${RECONCILIATION_PAUSE_SECONDES:-60}
      # Le plafond d'un dépôt d'ouvrage depuis la console. Doit rester en accord
      # avec le client_max_body_size du nginx placé devant.
      TAILLE_MAX_IMPORT: ${TAILLE_MAX_IMPORT:-104857600}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
    ports: ["${API_PORT:-8250}:8250"]
    volumes:
      # Le dossier où la console dépose les PDF reçus, et où le pipeline va les
      # chercher. Partagé avec l'ouvrier, qui les ingère.
      - ../../livres:/chantier/livres
      # Le cache des modèles. Sans lui, l'API retélécharge deux gigaoctets de
      # poids à chaque recréation du conteneur, ce qui sur nos connexions veut
      # dire une journée. Inutile quand la recherche sémantique est désactivée,
      # et sans effet dans ce cas.
      - ascenda_modeles:/home/ascenda/.cache/huggingface

  # L'ouvrier : il exécute les travaux longs que la console met dans la file.
  #
  # Un processus séparé de l'API, pour deux raisons. Une requête HTTP qui dure
  # dix minutes est une requête qui échoue, et l'image de l'API ne porte pas le
  # pipeline : elle sert la base, elle ne la fabrique pas. L'ouvrier, lui, monte
  # `pipeline/`, `data/` et `livres/` depuis le dépôt cloné.
  #
  # Un seul exemplaire. Sur une machine à seize gigaoctets partagés avec
  # PostgreSQL et l'API, deux vectorisations en parallèle ne vont pas deux fois
  # plus vite : elles se disputent le processeur et finissent en retard toutes
  # les deux. La réservation par `skip locked` permettrait d'en lancer
  # plusieurs le jour où la machine le supporte.
  travailleur:
    image: ascenda-api:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        # L'ouvrier vectorise : il lui faut le modèle, contrairement à l'API.
        AVEC_RECHERCHE_SEMANTIQUE: ${RECHERCHE_SEMANTIQUE:-false}
    container_name: ascenda-travailleur
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-large}
      PYTHON_PIPELINE: python
      PYTHONPATH: /chantier/pipeline
    volumes:
      - ../../pipeline:/chantier/pipeline:ro
      - ../../data:/chantier/data
      # En écriture : la console y dépose les PDF déposés depuis le navigateur.
      - ../../livres:/chantier/livres
      - ascenda_modeles:/home/ascenda/.cache/huggingface
    working_dir: /chantier
    # L'arrêt laisse le travail en cours aller au bout : une base à moitié
    # écrite coûte plus cher qu'une minute d'attente au redéploiement.
    stop_grace_period: 120s
    entrypoint: ["python", "pipeline/travailleur.py"]
    # L'image porte la sonde de l'API, qui interroge un port que l'ouvrier
    # n'ouvre pas : sans cette ligne, il serait toujours déclaré malade. Sa sonde
    # à lui lit le signe de vie que sa boucle touche toutes les cinq secondes, et
    # son battement toutes les trente pendant un long travail.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/ouvrier-vivant')<120 else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3

  # Le chargement du corpus, à la demande.
  #
  # L'image de l'API ne porte ni `pipeline/` ni `data/` : elle sert la base,
  # elle ne la remplit pas. Ce service monte les deux depuis le dépôt cloné sur
  # le serveur et lance l'import, qui est idempotent. Sans lui, une machine
  # neuve n'a aucun moyen de charger le corpus, faute de Python hors conteneur.
  #
  #   docker compose ... run --rm importeur
  #   docker compose ... run --rm importeur --verifier    # ce qui bougerait
  #
  # `profiles` le tient à l'écart des montées de pile : il ne démarre que
  # lorsqu'on l'appelle par son nom.
  importeur:
    profiles: ["outils"]
    image: ascenda-api:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PYTHONPATH: /chantier/pipeline
    volumes:
      - ../../pipeline:/chantier/pipeline:ro
      - ../../data:/chantier/data:ro
    working_dir: /chantier
    entrypoint: ["python", "pipeline/derive/importer.py"]

  vitrine:
    build:
      context: ../..
      dockerfile: apps/web-vitrine/Dockerfile
      args:
        # Figée à la construction : Next l'inline dans les pages pré-rendues.
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL}
        NEXT_PUBLIC_SITE_URL: ${SITE_BASE_URL:-http://localhost:3251}
        NEXT_PUBLIC_APP_URL: ${APP_URL:-}
        NEXT_PUBLIC_APK_URL: ${APK_URL:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
        NEXT_PUBLIC_FORME_JURIDIQUE: ${FORME_JURIDIQUE:-}
        NEXT_PUBLIC_IMMATRICULATION: ${IMMATRICULATION:-}
        NEXT_PUBLIC_ADRESSE: ${ADRESSE:-}
        NEXT_PUBLIC_TELEPHONE: ${TELEPHONE_PUBLIC:-}
        NEXT_PUBLIC_HEBERGEUR: ${HEBERGEUR:-}
    container_name: ascenda-vitrine
    restart: unless-stopped
    environment:
      # Les appels que le serveur de la vitrine fait lui-même passent par le
      # réseau Docker, pas par Internet et le nginx de la machine.
      API_INTERNE: http://api:8250
    depends_on: [api]
    ports: ["3251:3251"]

volumes:
  ascenda_modeles: {}
