# ASCENDA derrière le nginx déjà présent sur le serveur.
#
# À poser dans le répertoire des sites de ce nginx, puis à recharger :
#   docker exec backend-nginx-1 nginx -t      # on vérifie avant de recharger
#   docker exec backend-nginx-1 nginx -s reload
#
# Les deux ports sont ceux publiés sur la boucle locale par
# docker-compose.serveur-partage.yml. Si vous les changez là, changez-les ici.
#
# `host.docker.internal` ne résout pas partout : si nginx tourne lui-même en
# conteneur, remplacez-le par l'adresse de la passerelle Docker, que donne
#   docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}'
# ou attachez le conteneur nginx au réseau du compose ASCENDA et visez
# directement `ascenda-api:8250` et `ascenda-vitrine:3251`.

upstream ascenda_api     { server 127.0.0.1:8260; }
upstream ascenda_vitrine { server 127.0.0.1:3260; }

# L'acharnement sur le mot de passe. La console d'exploitation vit à une adresse
# publique et l'API ne compte pas les essais ratés : sans cette limite, rien
# n'empêche d'essayer dix mille mots de passe par minute sur un compte
# d'administration. Cinq essais par minute et par adresse, avec une réserve de
# cinq pour ne pas punir quelqu'un qui se trompe deux fois de suite.
limit_req_zone $binary_remote_addr zone=ascenda_auth:10m rate=5r/m;

# Le reste de l'API : large, mais pas illimité. Un lecteur qui tourne les pages
# ne dépasse jamais quelques appels par seconde.
limit_req_zone $binary_remote_addr zone=ascenda_api:10m rate=30r/s;

# ------------------------------------------------------------------ le site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ascenda-books.online www.ascenda-books.online;

    ssl_certificate     /etc/letsencrypt/live/ascenda-books.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ascenda-books.online/privkey.pem;

    # La vitrine sert des pages statiques et des images de partage composées à
    # la volée : quelques secondes suffisent largement.
    proxy_read_timeout 30s;
    client_max_body_size 8m;

    location / {
        proxy_pass http://ascenda_vitrine;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -------------------------------------------------------------------- l'API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.ascenda-books.online;

    # Le même certificat que la vitrine : certbot range tout sous le premier nom
    # demandé, et les trois noms ont été demandés en une fois. Viser
    # /live/api.ascenda-books.online/ ferait échouer `nginx -t` sur un fichier
    # qui n'existe pas.
    ssl_certificate     /etc/letsencrypt/live/ascenda-books.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ascenda-books.online/privkey.pem;

    # Cent mégaoctets : c'est le plafond d'un dépôt d'ouvrage depuis la console.
    # Un nginx qui refuse à un mégaoctet rend la fonction inutilisable sans
    # qu'aucun message ne le dise.
    client_max_body_size 100m;

    # Une ingestion lancée depuis la console peut tenir plusieurs minutes, et
    # une recherche vectorielle sur un corpus froid prend son temps.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Les routes qui vérifient un mot de passe, comptées à part.
    location ~ ^/v1/auth/(connexion|inscription)$ {
        limit_req zone=ascenda_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://ascenda_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Le webhook de Tara n'est pas limité : c'est leur serveur qui appelle, et
    # une notification refusée est un paiement qu'on ne rattache pas.
    location = /v1/paiements/webhook/tara {
        proxy_pass http://ascenda_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=ascenda_api burst=60 nodelay;
        proxy_pass http://ascenda_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sans cela, l'API voit http:// et fabrique des liens en clair dans les
        # courriels et les images de partage.
        proxy_set_header X-Forwarded-Host  $host;
    }
}

# ------------------------------------------------- redirection du clair vers
server {
    listen 80;
    listen [::]:80;
    server_name ascenda-books.online www.ascenda-books.online api.ascenda-books.online;

    # Laisse passer la validation des certificats, redirige tout le reste.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
