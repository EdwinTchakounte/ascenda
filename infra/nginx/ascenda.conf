# ASCENDA derrière le nginx déjà présent sur le serveur.
#
# À poser dans le répertoire des sites de ce nginx, puis à recharger :
#   docker exec backend-nginx-1 nginx -t      # on vérifie avant de recharger
#   docker exec backend-nginx-1 nginx -s reload
#
# Ce nginx tourne lui-même dans un conteneur. Viser `127.0.0.1:8260` depuis
# l'intérieur d'un conteneur ne désigne pas la machine hôte mais le conteneur
# lui-même : la requête n'arriverait jamais. C'est l'erreur classique, et elle
# ne se voit qu'à l'exécution, sous la forme d'un 502 inexplicable.
#
# On joint donc les services par leur nom sur le réseau du compose ASCENDA,
# auquel il faut rattacher ce nginx une fois :
#
#   docker network connect ascenda_default backend-nginx-1
#
# Cela ne recrée pas le conteneur et ne touche pas au compose de l'autre projet.
# En contrepartie, le rattachement est perdu si le conteneur est recréé : la
# commande est à rejouer, comme la copie des fichiers de site.
#
# Avantage supplémentaire : aucun port n'a besoin d'être publié sur l'hôte. La
# pile ne s'expose nulle part, même pas sur la boucle locale.

# Le résolveur interne de Docker, et des noms passés par variable.
#
# Un bloc `upstream`, ou même un nom écrit en clair dans `proxy_pass`, est
# résolu au chargement de la configuration : nginx refuserait alors de démarrer
# tant qu'ASCENDA n'est pas monté, et ferait tomber les six autres sites de la
# machine avec lui. Vérifié au banc d'essai, il répond « host not found in
# upstream ».
#
# En passant par une variable, la résolution est repoussée au moment de la
# requête. nginx démarre quoi qu'il arrive, et répond 502 le temps qu'ASCENDA
# remonte. La contrepartie est qu'il faut écrire `$request_uri` soi-même : avec
# une variable, nginx cesse d'ajouter le chemin d'origine.
resolver 127.0.0.11 valid=10s ipv6=off;

# L'acharnement sur le mot de passe. La console d'exploitation vit à une adresse
# publique et l'API ne compte pas les essais ratés : sans cette limite, rien
# n'empêche d'essayer dix mille mots de passe par minute sur un compte
# d'administration. Cinq essais par minute et par adresse, avec une réserve de
# cinq pour ne pas punir quelqu'un qui se trompe deux fois de suite.
limit_req_zone $binary_remote_addr zone=ascenda_auth:10m rate=5r/m;

# Le reste de l'API : large, mais pas illimité. Un lecteur qui tourne les pages
# ne dépasse jamais quelques appels par seconde.
limit_req_zone $binary_remote_addr zone=ascenda_api:10m rate=30r/s;

# ------------------------------------------------------------------ le site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ascenda-books.online www.ascenda-books.online;

    ssl_certificate     /etc/letsencrypt/live/ascenda-books.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ascenda-books.online/privkey.pem;

    # La vitrine sert des pages statiques et des images de partage composées à
    # la volée : quelques secondes suffisent largement.
    proxy_read_timeout 30s;
    client_max_body_size 8m;

    location / {
        set $ascenda_vitrine ascenda-vitrine:3251;
        proxy_pass http://$ascenda_vitrine$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -------------------------------------------------------------------- l'API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.ascenda-books.online;

    # Le même certificat que la vitrine : certbot range tout sous le premier nom
    # demandé, et les trois noms ont été demandés en une fois. Viser
    # /live/api.ascenda-books.online/ ferait échouer `nginx -t` sur un fichier
    # qui n'existe pas.
    ssl_certificate     /etc/letsencrypt/live/ascenda-books.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ascenda-books.online/privkey.pem;

    # Cent mégaoctets : c'est le plafond d'un dépôt d'ouvrage depuis la console.
    # Un nginx qui refuse à un mégaoctet rend la fonction inutilisable sans
    # qu'aucun message ne le dise.
    client_max_body_size 100m;

    # Une ingestion lancée depuis la console peut tenir plusieurs minutes, et
    # une recherche vectorielle sur un corpus froid prend son temps.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Les routes qui vérifient un secret, comptées à part : un mot de passe, ou
    # un code d'accès qu'on essaierait de deviner à la chaîne.
    location ~ ^/v1/(auth/(connexion|inscription)|codes/activer)$ {
        limit_req zone=ascenda_auth burst=5 nodelay;
        limit_req_status 429;
        set $ascenda_api ascenda-api:8250;
        proxy_pass http://$ascenda_api$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Le webhook de Tara n'est pas limité : c'est leur serveur qui appelle, et
    # une notification refusée est un paiement qu'on ne rattache pas.
    location = /v1/paiements/webhook/tara {
        set $ascenda_api ascenda-api:8250;
        proxy_pass http://$ascenda_api$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=ascenda_api burst=60 nodelay;
        set $ascenda_api ascenda-api:8250;
        proxy_pass http://$ascenda_api$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sans cela, l'API voit http:// et fabrique des liens en clair dans les
        # courriels et les images de partage.
        proxy_set_header X-Forwarded-Host  $host;
    }
}

# ------------------------------------------------- redirection du clair vers
server {
    listen 80;
    listen [::]:80;
    server_name ascenda-books.online www.ascenda-books.online api.ascenda-books.online;

    # Laisse passer la validation des certificats, redirige tout le reste.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
