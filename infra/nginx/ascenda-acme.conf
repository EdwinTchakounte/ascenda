# Étape 1 sur 2 : de quoi obtenir les certificats, et rien d'autre.
#
# Le piège que ce fichier évite : `ascenda.conf` déclare des `ssl_certificate`
# qui n'existent pas encore, et nginx refuse de recharger sur un certificat
# introuvable. On ne peut donc pas poser la configuration complète d'abord. Mais
# sans configuration du tout, le nginx en place laisse tomber les noms qu'il ne
# connaît pas, et la validation d'ACME n'aboutit pas non plus.
#
# Ce fichier est la sortie : il ne parle qu'en clair, il ne sert que le chemin
# de validation, et il redirige le reste. On le pose, on demande les
# certificats, puis on le remplace par `ascenda.conf`.
#
#   1. copier ce fichier dans le répertoire des sites du nginx
#   2. docker exec backend-nginx-1 nginx -t && docker exec backend-nginx-1 nginx -s reload
#   3. demander les certificats (voir DEPLOIEMENT.md)
#   4. remplacer ce fichier par ascenda.conf, vérifier, recharger

server {
    listen 80;
    listen [::]:80;
    server_name ascenda-books.online www.ascenda-books.online api.ascenda-books.online;

    # Le répertoire que certbot remplit en mode webroot. Il doit être monté dans
    # le conteneur nginx et visible de certbot : c'est le seul point commun
    # indispensable entre les deux.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Tant que les certificats n'existent pas, on ne redirige pas vers https :
    # cela enverrait les visiteurs sur un certificat qui ne correspond à aucun
    # de nos noms. On dit plutôt que le site arrive.
    location / {
        default_type text/plain;
        return 200 "ASCENDA arrive.\n";
    }
}
